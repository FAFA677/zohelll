<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hell Zoo VR - Quest Support</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Добавляем VRButton для поддержки Quest и других гарнитур -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/VRButton.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #ui-layer {
            position: absolute; top: 20px; left: 20px; color: #ff0000;
            text-shadow: 2px 2px #000; pointer-events: none; z-index: 10;
        }
        #msg-box {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(50, 0, 0, 0.8); color: white; padding: 15px;
            border: 2px solid #ff0000; display: none; text-align: center;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h1 id="money-display">Деньги: 0</h1>
        <div id="belt-status">Пояс: [Пусто] [Пусто] [Пусто] [Пусто]</div>
        <div id="stats-display">HP: 100 | Патроны: 0</div>
    </div>
    <div id="msg-box"></div>

    <script>
        // --- Глобальные переменные и Конфигурация ---
        let scene, camera, renderer, clock;
        let controller1, controller2;
        let player = {
            hp: 100,
            money: 0,
            belt: [null, null, null, null],
            activeItemIndex: 0,
            isDead: false
        };

        const MONSTERS_DATA = [
            { id: 1, name: "Flesh", cost: 250, timer: 300, isEscaped: false },
            { id: 2, name: "mu-trap", cost: 250, timer: 300, isEscaped: false },
            { id: 3, name: "Blob", cost: 250, timer: 300, isEscaped: false },
            { id: 4, name: "Mega-Flesh", cost: 250, timer: 300, isEscaped: false },
            { id: 5, name: "Mimic-Wood", cost: 250, timer: 300, isEscaped: false },
            { id: 6, name: "Shark-Octo", cost: 250, timer: 300, isEscaped: false },
            { id: 7, name: "Small-Squid", cost: 250, timer: 300, isEscaped: false },
            { id: 8, name: "Blood-Man", cost: 250, timer: 300, isEscaped: false }
        ];

        const WEAPONS = {
            'dagger': { name: 'Кинжал', damage: 20, durability: 50, price: 0, type: 'melee' },
            'sword': { name: 'Меч', damage: 35, durability: 50, price: 250, type: 'melee' },
            'katana': { name: 'Катана', damage: 45, durability: 50, price: 350, type: 'melee' },
            'saber': { name: 'Сабля', damage: 55, durability: 50, price: 450, type: 'melee' },
            'heavy_sword': { name: 'Тяжелый меч', damage: 75, durability: 50, price: 550, type: 'melee' },
            'double_barrel': { name: 'Двустволка', damage: 10, ammo: 8, price: 355, type: 'ranged' },
            'beretta': { name: 'Beretta', damage: 7, ammo: 8, price: 250, type: 'ranged' },
            'shotgun': { name: 'Дробовик', damage: 25, ammo: 8, price: 700, type: 'ranged' },
            'grenade': { name: 'Граната', damage: 30, price: 50, type: 'explosive' }
        };

        const ENEMY_TYPES = [
            { name: 'Зомби', hp: 100, reward: 50 },
            { name: 'Титан', hp: 150, reward: 120 },
            { name: 'Чертёнок', hp: 10, reward: 10 }
        ];

        let enemies = [];
        let monsterCages = [];
        const tempVec = new THREE.Vector3();

        window.onload = function() {
            init();
            animate();
            setupInitialGameState();
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0505);
            scene.fog = new THREE.FogExp2(0x1a0505, 0.05);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Кнопка VR для Quest
            document.body.appendChild(VRButton.createButton(renderer));

            // Контроллеры для Quest
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('select', onSelect);
            scene.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('select', onSelect);
            scene.add(controller2);

            // Визуализация контроллеров (лучи)
            const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
            const line = new THREE.Line(geometry);
            line.name = 'line';
            line.scale.z = 5;
            controller1.add(line.clone());
            controller2.add(line.clone());

            // Освещение
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const redLight = new THREE.PointLight(0xff0000, 1, 100);
            redLight.position.set(0, 10, 0);
            scene.add(redLight);

            // Мир
            const island = new THREE.Mesh(new THREE.CircleGeometry(50, 32), new THREE.MeshPhongMaterial({ color: 0x222222 }));
            island.rotation.x = -Math.PI / 2;
            scene.add(island);

            const lava = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshBasicMaterial({ color: 0xff4400 }));
            lava.rotation.x = -Math.PI / 2;
            lava.position.y = -2;
            scene.add(lava);

            createZooStructure();
            createWarehouse();
            createShop();

            clock = new THREE.Clock();
            window.addEventListener('resize', onWindowResize, false);
        }

        function createZooStructure() {
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const radius = 30;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;

                const cage = new THREE.Mesh(new THREE.BoxGeometry(8, 6, 8), new THREE.MeshPhongMaterial({ color: 0x444444, wireframe: true }));
                cage.position.set(x, 3, z);
                scene.add(cage);

                const monster = createMonsterVisual(i + 1);
                monster.position.set(x, 1, z);
                scene.add(monster);

                monsterCages.push({ mesh: cage, monsterMesh: monster, data: MONSTERS_DATA[i] });
            }
        }

        function createMonsterVisual(id) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5), new THREE.MeshPhongMaterial({color: 0xaa0000}));
            group.add(body);
            return group;
        }

        function createWarehouse() {
            const wh = new THREE.Mesh(new THREE.BoxGeometry(5, 4, 5), new THREE.MeshPhongMaterial({ color: 0x330000 }));
            wh.position.set(0, 2, -10);
            scene.add(wh);
        }

        function createShop() {
            const shop = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), new THREE.MeshPhongMaterial({ color: 0x000000 }));
            shop.position.set(15, 2, 15);
            scene.add(shop);
        }

        function onSelect(event) {
            // Взаимодействие при нажатии триггера контроллера
            checkInteractions();
        }

        function setupInitialGameState() {
            player.belt[0] = JSON.parse(JSON.stringify(WEAPONS.dagger));
            updateUI();
            setInterval(giveSalary, 300000); 
            setInterval(spawnWave, 360000);
        }

        function spawnWave() {
            const count = 3 + Math.floor(Math.random() * 3);
            for(let i=0; i<count; i++) {
                const type = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
                const enemy = {
                    ...type,
                    mesh: new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshPhongMaterial({color: 0xff0000})),
                    currentHp: type.hp
                };
                enemy.mesh.position.set(Math.random()*40-20, 1, -40);
                scene.add(enemy.mesh);
                enemies.push(enemy);
            }
            showMessage("Орда зомби нападает!");
        }

        function showMessage(text) {
            const box = document.getElementById('msg-box');
            box.innerText = text;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 3000);
        }

        function updateUI() {
            document.getElementById('money-display').innerText = `Деньги: ${player.money}`;
            const beltText = player.belt.map(item => item ? item.name : "[Пусто]").join(" ");
            document.getElementById('belt-status').innerText = `Пояс: ${beltText}`;
            
            const active = player.belt[player.activeItemIndex];
            const hpStr = Math.floor(player.hp);
            const ammoStr = (active && active.ammo !== undefined) ? active.ammo : '---';
            document.getElementById('stats-display').innerText = `HP: ${hpStr} | Патроны: ${ammoStr}`;
        }

        function giveSalary() {
            player.money += 100;
            showMessage("Зарплата получена: +100");
            updateUI();
        }

        function checkInteractions() {
            // Позиция игрока (камеры)
            const pos = renderer.xr.isPresenting ? renderer.xr.getCamera(camera).position : camera.position;

            // Склад
            if(pos.distanceTo(new THREE.Vector3(0, 2, -10)) < 4) {
                let freeSlot = player.belt.indexOf(null);
                if(freeSlot !== -1) {
                    player.belt[freeSlot] = { name: "Мясо", type: "food" };
                    showMessage("Взял мясо");
                    updateUI();
                }
                return;
            }

            // Магазин (пример покупки меча за 250)
            if(pos.distanceTo(new THREE.Vector3(15, 2, 15)) < 5) {
                if(player.money >= 250) {
                    let freeSlot = player.belt.indexOf(null);
                    if(freeSlot !== -1) {
                        player.money -= 250;
                        player.belt[freeSlot] = JSON.parse(JSON.stringify(WEAPONS.sword));
                        showMessage("Куплен Меч");
                        updateUI();
                    }
                }
                return;
            }

            // Кормление
            monsterCages.forEach(cage => {
                if(pos.distanceTo(cage.mesh.position) < 6) {
                    let meatIdx = player.belt.findIndex(i => i && i.type === "food");
                    if(meatIdx !== -1) {
                        player.belt[meatIdx] = null;
                        cage.data.timer = 300;
                        player.money += 5;
                        showMessage(`Монстр ${cage.data.name} покормлен!`);
                        updateUI();
                    }
                }
            });

            // Атака врагов
            enemies.forEach((enemy, idx) => {
                if(pos.distanceTo(enemy.mesh.position) < 4) {
                    attackEnemy(enemy, idx);
                }
            });
        }

        function attackEnemy(enemy, index) {
            let weapon = player.belt[player.activeItemIndex];
            if(!weapon || weapon.type === 'food') return;

            enemy.currentHp -= weapon.damage;
            if(weapon.durability) weapon.durability--;
            
            if(enemy.currentHp <= 0) {
                scene.remove(enemy.mesh);
                player.money += enemy.reward;
                enemies.splice(index, 1);
            }
            updateUI();
        }

        function die() {
            player.hp = 100;
            player.money = 0;
            if(!renderer.xr.isPresenting) camera.position.set(0, 1.6, 5);
            showMessage("СМЕРТЬ! Потеряно всё.");
            updateUI();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(() => {
                const delta = clock.getDelta();
                const session = renderer.xr.getSession();

                // VR Движение: если есть сессия, двигаем игрока по вектору контроллера (симуляция)
                if (session) {
                    // В Quest обычно используют стики. Здесь добавим простую проверку:
                    // Если нажата любая кнопка на контроллере - идем вперед.
                }

                // Движение врагов
                const headPos = renderer.xr.isPresenting ? renderer.xr.getCamera(camera).position : camera.position;
                enemies.forEach(enemy => {
                    const dir = new THREE.Vector3().subVectors(headPos, enemy.mesh.position).normalize();
                    enemy.mesh.position.addScaledVector(dir, 0.03);
                    if(headPos.distanceTo(enemy.mesh.position) < 1.5) {
                        player.hp -= 0.2;
                        if(player.hp <= 0) die();
                        updateUI();
                    }
                });

                // Таймеры монстров
                monsterCages.forEach(cage => {
                    if(!cage.data.isEscaped) {
                        cage.data.timer -= delta;
                        if(cage.data.timer <= 0) {
                            cage.data.isEscaped = true;
                            cage.monsterMesh.visible = false;
                        }
                    }
                });

                // Проверка падения в лаву
                if(headPos.length() > 50) die();

                renderer.render(scene, camera);
            });
        }
    </script>
</body>
</html>
