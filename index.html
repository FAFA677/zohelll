<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hell Zoo VR - Horror Survival</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #ui-layer {
            position: absolute; top: 20px; left: 20px; color: #ff0000;
            text-shadow: 2px 2px #000; pointer-events: none; z-index: 10;
        }
        #msg-box {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(50, 0, 0, 0.8); color: white; padding: 15px;
            border: 2px solid #ff0000; display: none; text-align: center;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h1 id="money-display">Деньги: 0</h1>
        <div id="belt-status">Пояс: [Пусто] [Пусто] [Пусто] [Пусто]</div>
    </div>
    <div id="msg-box"></div>

    <script>
        // --- Глобальные переменные и Конфигурация ---
        let scene, camera, renderer, clock;
        let player = {
            hp: 100,
            money: 0,
            belt: [null, null, null, null],
            activeItemIndex: 0,
            lastSalaryTime: 0,
            isDead: false
        };

        const MONSTERS_DATA = [
            { id: 1, name: "Flesh", cost: 250, hunger: 300, isEscaped: false },
            { id: 2, name: "mu-trap", cost: 250, hunger: 300, isEscaped: false },
            { id: 3, name: "Blob", cost: 250, hunger: 300, isEscaped: false },
            { id: 4, name: "Mega-Flesh", cost: 250, hunger: 300, isEscaped: false },
            { id: 5, name: "Mimic-Wood", cost: 250, hunger: 300, isEscaped: false },
            { id: 6, name: "Shark-Octo", cost: 250, hunger: 300, isEscaped: false },
            { id: 7, name: "Small-Squid", cost: 250, hunger: 300, isEscaped: false },
            { id: 8, name: "Blood-Man", cost: 250, hunger: 300, isEscaped: false }
        ];

        const WEAPONS = {
            'dagger': { name: 'Кинжал', damage: 20, durability: 50, price: 0, type: 'melee' },
            'sword': { name: 'Меч', damage: 35, durability: 50, price: 250, type: 'melee' },
            'katana': { name: 'Катана', damage: 45, durability: 50, price: 350, type: 'melee' },
            'saber': { name: 'Сабля', damage: 55, durability: 50, price: 450, type: 'melee' },
            'heavy_sword': { name: 'Тяжелый меч', damage: 75, durability: 50, price: 550, type: 'melee' },
            'double_barrel': { name: 'Двустволка', damage: 10, ammo: 8, price: 355, type: 'ranged' },
            'beretta': { name: 'Beretta', damage: 7, ammo: 8, price: 250, type: 'ranged' },
            'shotgun': { name: 'Дробовик', damage: 25, ammo: 8, price: 700, type: 'ranged' },
            'grenade': { name: 'Граната', damage: 30, price: 50, type: 'explosive' }
        };

        const ENEMY_TYPES = [
            { name: 'Зомби', hp: 100, reward: 50 },
            { name: 'Бронированный', hp: 110, reward: 70 },
            { name: 'Титан', hp: 150, reward: 120 },
            { name: 'Гончая', hp: 100, reward: 60 },
            { name: 'Обычный зомби', hp: 40, reward: 20 },
            { name: 'Чертёнок', hp: 10, reward: 10 },
            { name: 'Обугленный зомби', hp: 60, reward: 30 }
        ];

        let enemies = [];
        let worldItems = [];
        let monsterCages = [];

        // --- Инициализация сцены ---
        window.onload = function() {
            init();
            animate();
            setupInitialGameState();
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0505);
            scene.fog = new THREE.FogExp2(0x1a0505, 0.05);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Освещение
            const ambLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambLight);
            const redLight = new THREE.PointLight(0xff0000, 1, 100);
            redLight.position.set(0, 10, 0);
            scene.add(redLight);

            // Пол - Остров в лаве
            const islandGeo = new THREE.CircleGeometry(50, 32);
            const islandMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
            const island = new THREE.Mesh(islandGeo, islandMat);
            island.rotation.x = -Math.PI / 2;
            scene.add(island);

            const lavaGeo = new THREE.PlaneGeometry(2000, 2000);
            const lavaMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
            const lava = new THREE.Mesh(lavaGeo, lavaMat);
            lava.rotation.x = -Math.PI / 2;
            lava.position.y = -2;
            scene.add(lava);

            // Создание вольеров по кругу
            createZooStructure();
            
            // Склад мяса
            createWarehouse();

            // Магазин
            createShop();

            // VR Контроллеры (симуляция для десктопа)
            setupControllers();

            clock = new THREE.Clock();

            window.addEventListener('resize', onWindowResize, false);
        }

        function createZooStructure() {
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const radius = 30;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;

                // Клетка
                const cageGeo = new THREE.BoxGeometry(8, 6, 8);
                const cageMat = new THREE.MeshPhongMaterial({ 
                    color: 0x444444, 
                    wireframe: true 
                });
                const cage = new THREE.Mesh(cageGeo, cageMat);
                cage.position.set(x, 3, z);
                scene.add(cage);

                // Монстр внутри
                const monster = createMonsterVisual(i + 1);
                monster.position.set(x, 1, z);
                scene.add(monster);

                monsterCages.push({
                    mesh: cage,
                    monsterMesh: monster,
                    data: MONSTERS_DATA[i],
                    timer: 300 // 5 минут
                });
            }
        }

        function createMonsterVisual(id) {
            const group = new THREE.Group();
            let body;

            switch(id) {
                case 1: // Flesh
                    body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 2), new THREE.MeshPhongMaterial({color: 0xaa0000}));
                    const head = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshPhongMaterial({color: 0xaa0000}));
                    head.position.set(0, 0.8, 1);
                    group.add(body, head);
                    break;
                case 3: // Blob
                    body = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), new THREE.MeshPhongMaterial({color: 0xffff00}));
                    group.add(body);
                    break;
                // Остальные визуализации добавляются аналогично...
                default:
                    body = new THREE.Mesh(new THREE.IcosahedronGeometry(1), new THREE.MeshPhongMaterial({color: 0x550000}));
                    group.add(body);
            }
            return group;
        }

        function createWarehouse() {
            const whGeo = new THREE.BoxGeometry(5, 4, 5);
            const whMat = new THREE.MeshPhongMaterial({ color: 0x330000 });
            const wh = new THREE.Mesh(whGeo, whMat);
            wh.position.set(0, 2, -10);
            scene.add(wh);
            
            // Текст "СКЛАД"
            console.log("Склад мяса создан");
        }

        function createShop() {
            const shopGeo = new THREE.BoxGeometry(6, 4, 6);
            const shopMat = new THREE.MeshPhongMaterial({ color: 0x000000 });
            const shop = new THREE.Mesh(shopGeo, shopMat);
            shop.position.set(15, 2, 15);
            scene.add(shop);

            // Продавец Чёрт
            const devil = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshPhongMaterial({color: 0x111111}));
            devil.position.set(15, 1, 12);
            scene.add(devil);
        }

        function setupInitialGameState() {
            player.belt[0] = JSON.parse(JSON.stringify(WEAPONS.dagger));
            updateUI();
            
            // Таймер зарплаты и волн
            setInterval(giveSalary, 300000); // 5 мин
            setInterval(spawnWave, 360000); // 6 мин
        }

        function giveSalary() {
            player.money += 100; // Базовая
            showMessage("Зарплата получена: +100");
            updateUI();
        }

        function spawnWave() {
            const count = 3 + Math.floor(Math.random() * 3);
            for(let i=0; i<count; i++) {
                const type = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
                const enemy = {
                    ...type,
                    mesh: new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshPhongMaterial({color: 0xff0000})),
                    currentHp: type.hp
                };
                enemy.mesh.position.set(Math.random()*40-20, 1, -40);
                scene.add(enemy.mesh);
                enemies.push(enemy);
            }
            showMessage("Нападение монстров ада!");
        }

        function showMessage(text) {
            const box = document.getElementById('msg-box');
            box.innerText = text;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 3000);
        }

        function updateUI() {
            document.getElementById('money-display').innerText = `Деньги: ${player.money}`;
            const beltText = player.belt.map(item => item ? item.name : "[Пусто]").join(" ");
            document.getElementById('belt-status').innerText = `Пояс: ${beltText}`;
        }

        // --- Логика игры ---

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupControllers() {
            // В реальном VR здесь используются renderer.xr.getController
            // Для теста добавим управление WASD + Клик
            window.addEventListener('keydown', (e) => {
                const speed = 0.5;
                if(e.code === 'KeyW') camera.position.z -= speed;
                if(e.code === 'KeyS') camera.position.z += speed;
                if(e.code === 'KeyA') camera.position.x -= speed;
                if(e.code === 'KeyD') camera.position.x += speed;

                // Проверка падения в лаву
                if(camera.position.length() > 50) {
                    die();
                }
            });

            window.addEventListener('click', handleAction);
        }

        function handleAction() {
            // 1. Атака врагов
            // 2. Кормление (если рядом с клеткой и есть мясо)
            // 3. Покупка (если у магазина)
            checkInteractions();
        }

        function checkInteractions() {
            // Упрощенная проверка дистанции
            enemies.forEach((enemy, index) => {
                if(camera.position.distanceTo(enemy.mesh.position) < 3) {
                    attackEnemy(enemy, index);
                }
            });

            monsterCages.forEach(cage => {
                if(camera.position.distanceTo(cage.mesh.position) < 5) {
                    feedMonster(cage);
                }
            });
            
            // Склад
            if(camera.position.distanceTo(new THREE.Vector3(0, 2, -10)) < 4) {
                takeMeat();
            }
        }

        function takeMeat() {
            // Поиск свободного места в инвентаре
            let freeSlot = player.belt.indexOf(null);
            if(freeSlot !== -1) {
                player.belt[freeSlot] = { name: "Мясо", type: "food" };
                showMessage("Взял мясо со склада");
                updateUI();
            } else {
                showMessage("Инвентарь полон!");
            }
        }

        function feedMonster(cage) {
            let meatIndex = player.belt.findIndex(i => i && i.type === "food");
            if(meatIndex !== -1) {
                player.belt[meatIndex] = null;
                cage.timer = 300;
                player.money += 5;
                showMessage(`Вы покормили ${cage.data.name}! +5$`);
                updateUI();
            }
        }

        function attackEnemy(enemy, index) {
            let weapon = player.belt[player.activeItemIndex];
            if(!weapon || weapon.type === 'food') return;

            enemy.currentHp -= weapon.damage;
            if(weapon.durability) weapon.durability--;
            
            if(weapon.durability <= 0 && weapon.type === 'melee') {
                player.belt[player.activeItemIndex] = null;
                showMessage("Оружие сломалось!");
            }

            if(enemy.currentHp <= 0) {
                scene.remove(enemy.mesh);
                player.money += enemy.reward;
                enemies.splice(index, 1);
                showMessage(`Убит ${enemy.name}! Продано за ${enemy.reward}$`);
            }
            updateUI();
        }

        function die() {
            player.hp = 100;
            player.money = 0;
            camera.position.set(0, 1.6, 5);
            showMessage("ВЫ ПОГИБЛИ! Все деньги потеряны.");
            updateUI();
        }

        function animate() {
            renderer.setAnimationLoop(() => {
                const delta = clock.getDelta();

                // Движение врагов к игроку
                enemies.forEach(enemy => {
                    const dir = new THREE.Vector3().subVectors(camera.position, enemy.mesh.position).normalize();
                    enemy.mesh.position.addScaledVector(dir, 0.02);
                    
                    if(camera.position.distanceTo(enemy.mesh.position) < 1.5) {
                        player.hp -= 0.1; // Постепенный урон
                        if(player.hp <= 0) die();
                    }
                });

                // Таймеры голода
                monsterCages.forEach(cage => {
                    if(!cage.data.isEscaped) {
                        cage.timer -= delta;
                        if(cage.timer <= 0) {
                            cage.data.isEscaped = true;
                            cage.monsterMesh.visible = false;
                            showMessage(`${cage.data.name} СБЕЖАЛ! Купите нового в магазине.`);
                        }
                    }
                });

                renderer.render(scene, camera);
            });
        }
    </script>
</body>
</html>
