<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hell Zoo VR - Survival Horror</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff4444;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            z-index: 10;
        }
        .hud-top { font-size: 1.2rem; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; }
        .danger { color: #ff0000; text-shadow: 0 0 10px red; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="hud-top">
            <div>ЗДОРОВЬЕ: <span id="hp-val">100</span> | ДЕНЬГИ: $<span id="money-val">0</span></div>
            <div id="status">Статус: Смена началась</div>
            <div id="wave-timer">След. рейд через: <span id="wave-time">06:00</span></div>
            <div id="fed-status">До кормления: <span id="hunger-time">05:00</span></div>
        </div>
    </div>

    <a-scene fog="type: exponential; color: #1a0505; density: 0.1">
        <a-assets>
            <img id="blood-floor" src="https://i.imgur.com/vH6vGxk.jpg" crossorigin="anonymous">
            <img id="stone-tex" src="https://i.imgur.com/83p157p.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- Окружение -->
        <a-sky color="#050000"></a-sky>
        <a-plane id="floor" position="0 0 0" rotation="-90 0 0" width="100" height="100" src="#blood-floor" repeat="50 50"></a-plane>
        
        <!-- Склад мяса -->
        <a-entity position="-20 0 15">
            <a-box position="0 1.5 0" width="4" height="3" depth="4" color="#442222">
                <a-text value="СКЛАД МЯСА" align="center" position="0 2 2.1" color="red"></a-text>
            </a-box>
            <a-box class="interactable" id="meat-pile" position="0 0.5 2.5" width="1" height="0.5" depth="1" color="#ff0000" onclick="takeMeat()"></a-box>
        </a-entity>

        <!-- Магазин оружия -->
        <a-entity position="20 0 15">
            <a-box position="0 1.5 0" width="6" height="4" depth="2" color="#222244">
                <a-text value="МАГАЗИН" align="center" position="0 2.5 1.1" color="cyan"></a-text>
            </a-box>
            <!-- Прилавки -->
            <a-box class="interactable" position="-2 0.8 1.2" width="0.8" height="0.4" depth="0.4" color="#555" onclick="buyWeapon('Sword')">
                <a-text value="MECH $250" scale="0.3 0.3 0.3" position="0 0.3 0" align="center"></a-text>
            </a-box>
            <a-box class="interactable" position="0 0.8 1.2" width="0.8" height="0.4" depth="0.4" color="#555" onclick="buyWeapon('Ammo')">
                <a-text value="AMMO $20" scale="0.3 0.3 0.3" position="0 0.3 0" align="center"></a-text>
            </a-box>
            <a-box class="interactable" position="2 0.8 1.2" width="0.8" height="0.4" depth="0.4" color="#33cc33" onclick="sellCorpses()">
                <a-text value="SELL BODIES" scale="0.3 0.3 0.3" position="0 0.3 0" align="center"></a-text>
            </a-box>
        </a-entity>

        <!-- Ловушки -->
        <a-entity id="traps-container"></a-entity>

        <!-- Зона Лабиринта (скрыта далеко) -->
        <a-entity id="maze-dimension" position="1000 0 1000" visible="false">
            <a-light type="ambient" intensity="0.2"></a-light>
            <a-entity id="maze-walls"></a-entity>
            <a-box id="maze-exit" position="0 1 0" color="green" scale="2 2 2" onclick="exitMaze()"></a-box>
        </a-entity>

        <!-- Клетки с монстрами (из прошлой версии) -->
        <a-entity id="enclosures-container">
            <!-- Пример клетки 1 -->
            <a-entity position="-10 0 -5" class="enclosure" data-monster="Flesh">
                <a-box position="0 2.5 0" width="6" height="5" depth="6" material="opacity: 0.2; wireframe: true"></a-box>
                <a-box class="interactable" position="0 0.5 3.2" width="1" height="0.5" depth="0.5" color="#ff4444" onclick="feedMonster('Flesh')"></a-box>
            </a-entity>
        </a-entity>

        <!-- Камера и Пояс -->
        <a-entity id="rig" position="0 0 20">
            <a-camera>
                <a-cursor color="#ff0000" raycaster="objects: .interactable"></a-cursor>
                <!-- Инвентарь на поясе (привязан к камере для простоты управления взглядом) -->
                <a-entity id="belt" position="0 -0.5 -1">
                    <a-box id="slot0" position="-0.45 0 0" scale="0.2 0.2 0.05" color="#222" opacity="0.8"></a-box>
                    <a-box id="slot1" position="-0.15 0 0" scale="0.2 0.2 0.05" color="#222" opacity="0.8"></a-box>
                    <a-box id="slot2" position="0.15 0 0" scale="0.2 0.2 0.05" color="#222" opacity="0.8"></a-box>
                    <a-box id="slot3" position="0.45 0 0" scale="0.2 0.2 0.05" color="#222" opacity="0.8"></a-box>
                </a-entity>
            </a-camera>
            <a-entity laser-controls="hand: right" raycaster="objects: .interactable"></a-entity>
        </a-entity>

        <!-- Контейнер для опасных монстров -->
        <a-entity id="enemy-container"></a-entity>

    </a-scene>

    <script>
        // Данные игры
        const player = {
            hp: 100,
            money: 0,
            inventory: ['Dagger', null, null, null],
            corpses: 0,
            inMaze: false,
            mazeTimer: 300
        };

        const weapons = {
            'Dagger': { damage: 20, price: 0, type: 'melee', durability: 50 },
            'Sword': { damage: 35, price: 250, type: 'melee', durability: 50 },
            'Katana': { damage: 45, price: 350, type: 'melee', durability: 50 },
            'Saber': { damage: 55, price: 450, type: 'melee', durability: 50 },
            'HeavySword': { damage: 75, price: 550, type: 'melee', durability: 50 },
            'DoubleShotgun': { damage: 10, price: 355, type: 'ranged', ammo: 8 },
            'Beretta': { damage: 7, price: 250, type: 'ranged', ammo: 8 },
            'Shotgun': { damage: 25, price: 700, type: 'ranged', ammo: 8 },
            'Meat': { type: 'item' }
        };

        let hungerTimer = 300;
        let waveTimer = 360; 
        const scene = document.querySelector('a-scene');

        // Инициализация пояса
        function updateBeltUI() {
            for (let i = 0; i < 4; i++) {
                const slot = document.getElementById(`slot${i}`);
                const item = player.inventory[i];
                slot.setAttribute('color', item ? '#444' : '#222');
                // Визуализация названия
                let label = slot.querySelector('.label');
                if (!label) {
                    label = document.createElement('a-text');
                    label.setAttribute('class', 'label');
                    label.setAttribute('align', 'center');
                    label.setAttribute('scale', '0.1 0.1 0.1');
                    label.setAttribute('position', '0 0 0.1');
                    slot.appendChild(label);
                }
                label.setAttribute('value', item || 'EMPTY');
            }
        }

        // Поднять мясо
        window.takeMeat = function() {
            addToInventory('Meat');
        };

        function addToInventory(item) {
            let placed = false;
            for (let i = 0; i < 4; i++) {
                if (player.inventory[i] === null) {
                    player.inventory[i] = item;
                    placed = true;
                    break;
                }
            }
            if (!placed) {
                console.log("Пояс переполнен! Предмет выброшен.");
                // Логика выброса на пол
            }
            updateBeltUI();
        }

        // Покупка оружия
        window.buyWeapon = function(type) {
            if (type === 'Ammo') {
                if (player.money >= 20) {
                    player.money -= 20;
                    // Ищем первое дальнобойное в инвентаре
                    for(let i=0; i<4; i++) {
                        if (player.inventory[i] && weapons[player.inventory[i]].type === 'ranged') {
                            weapons[player.inventory[i]].ammo += 8;
                            break;
                        }
                    }
                }
            } else {
                let w = weapons[type];
                if (player.money >= w.price) {
                    player.money -= w.price;
                    addToInventory(type);
                }
            }
            updateHUD();
        }

        // Продажа трупов
        window.sellCorpses = function() {
            player.money += player.corpses * 50;
            player.corpses = 0;
            updateHUD();
        }

        // Кормление
        window.feedMonster = function(name) {
            const idx = player.inventory.indexOf('Meat');
            if (idx !== -1) {
                player.inventory[idx] = null;
                player.money += 5;
                hungerTimer = 300;
                updateBeltUI();
                updateHUD();
                document.getElementById('status').innerText = `Покормлен: ${name}`;
            } else {
                document.getElementById('status').innerText = "НУЖНО МЯСО СО СКЛАДА!";
            }
        };

        // Система Рейдов
        function spawnRaid() {
            const count = Math.floor(Math.random() * 3) + 3; // 3-5
            const types = [
                {n: 'Zombie', hp: 40}, {n: 'ArmorZombie', hp: 110}, {n: 'Titan', hp: 150},
                {n: 'Hound', hp: 100}, {n: 'Imp', hp: 10}, {n: 'Burned', hp: 60}
            ];

            for (let i = 0; i < count; i++) {
                const t = types[Math.floor(Math.random() * types.length)];
                const enemy = document.createElement('a-entity');
                enemy.setAttribute('class', 'interactable enemy');
                enemy.setAttribute('position', `${Math.random()*20 - 10} 1.5 -20`);
                enemy.setAttribute('geometry', 'primitive: capsule; radius: 0.5; length: 1');
                enemy.setAttribute('material', 'color', '#330000');
                enemy.dataset.hp = t.hp;
                enemy.dataset.name = t.n;
                
                enemy.addEventListener('click', () => attackEnemy(enemy));
                document.getElementById('enemy-container').appendChild(enemy);
            }
            waveTimer = Math.floor(Math.random() * 60) + 360; // 6-7 мин
        }

        function attackEnemy(el) {
            // Берем первое оружие из инвентаря
            let weaponName = player.inventory.find(i => i && weapons[i].damage);
            if (!weaponName) return;

            let w = weapons[weaponName];
            
            if (w.type === 'melee') {
                if (w.durability <= 0) {
                    document.getElementById('status').innerText = "ОРУЖИЕ СЛОМАНО!";
                    player.inventory[player.inventory.indexOf(weaponName)] = null;
                    updateBeltUI();
                    return;
                }
                w.durability--;
            } else if (w.type === 'ranged') {
                if (w.ammo <= 0) return;
                w.ammo--;
            }

            el.dataset.hp -= w.damage;
            if (el.dataset.hp <= 0) {
                player.corpses++;
                el.remove();
            }
        }

        // Ловушка Лабиринт
        function initTraps() {
            for (let i = 0; i < 5; i++) {
                const trap = document.createElement('a-entity');
                trap.setAttribute('geometry', 'primitive: box');
                trap.setAttribute('material', 'src: #stone-tex');
                trap.setAttribute('position', `${Math.random()*40 - 20} 0.1 ${Math.random()*40 - 20}`);
                trap.setAttribute('class', 'interactable');
                trap.addEventListener('click', () => enterMaze());
                document.getElementById('traps-container').appendChild(trap);
            }
        }

        function enterMaze() {
            player.inMaze = true;
            player.mazeTimer = 300;
            document.getElementById('maze-dimension').setAttribute('visible', 'true');
            document.getElementById('rig').setAttribute('position', '1000 0 1000');
            generateRandomMaze();
        }

        function exitMaze() {
            player.inMaze = false;
            document.getElementById('maze-dimension').setAttribute('visible', 'false');
            document.getElementById('rig').setAttribute('position', '0 0 15');
        }

        function generateRandomMaze() {
            const container = document.getElementById('maze-walls');
            container.innerHTML = '';
            for(let i=0; i<20; i++) {
                const wall = document.createElement('a-box');
                wall.setAttribute('position', `${(Math.random()-0.5)*20} 2 ${(Math.random()-0.5)*20}`);
                wall.setAttribute('scale', '1 4 5');
                wall.setAttribute('color', '#300');
                container.appendChild(wall);
            }
            document.getElementById('maze-exit').setAttribute('position', `${(Math.random()-0.5)*15} 1 ${(Math.random()-0.5)*15}`);
        }

        function updateHUD() {
            document.getElementById('hp-val').innerText = player.hp;
            document.getElementById('money-val').innerText = player.money;
        }

        // Главный цикл
        setInterval(() => {
            // Таймеры
            if (hungerTimer > 0) hungerTimer--;
            if (waveTimer > 0) waveTimer--;
            else spawnRaid();

            // Лабиринт
            if (player.inMaze) {
                player.mazeTimer--;
                if (player.mazeTimer <= 0) {
                    die();
                }
            }

            // Рендеринг времени
            const h_min = Math.floor(hungerTimer / 60);
            const h_sec = hungerTimer % 60;
            document.getElementById('hunger-time').innerText = `${h_min}:${h_sec.toString().padStart(2,'0')}`;

            const w_min = Math.floor(waveTimer / 60);
            const w_sec = waveTimer % 60;
            document.getElementById('wave-time').innerText = `${w_min}:${w_sec.toString().padStart(2,'0')}`;

            // Урон от монстров
            const enemies = document.querySelectorAll('.enemy');
            enemies.forEach(e => {
                // Очень упрощенная проверка дистанции
                const pos = e.getAttribute('position');
                const playerPos = document.getElementById('rig').getAttribute('position');
                const dist = Math.sqrt((pos.x-playerPos.x)**2 + (pos.z-playerPos.z)**2);
                if (dist < 2) {
                    player.hp -= (Math.random() * 5 + 5) / 10; // Урон в тик
                    updateHUD();
                    if (player.hp <= 0) die();
                }
            });

        }, 1000);

        function die() {
            player.hp = 100;
            player.money = 0;
            player.corpses = 0;
            player.inventory = ['Dagger', null, null, null];
            exitMaze();
            updateHUD();
            updateBeltUI();
            document.getElementById('status').innerText = "ВЫ ПОГИБЛИ И ПОТЕРЯЛИ ВСЁ!";
        }

        // Зарплата каждые 5 минут
        setInterval(() => {
            if (!player.inMaze) {
                player.money += 100; // Базовая зарплата
                updateHUD();
            }
        }, 300000);

        window.onload = () => {
            initTraps();
            updateBeltUI();
            updateHUD();
        };

    </script>
</body>
</html>
