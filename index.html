    <script>
      // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ИГРЫ ---
      let gameState = {
        money: 100,
        wave: 1,
        isShopOpen: false,
        inventory: [null, null, null, null], // 4 слота
        weapons: {
          'sword': { price: 100, name: 'Меч', type: 'melee', color: 'blue' },
          'pistol': { price: 200, name: 'Пистолет', type: 'range', color: 'grey' },
          'musket': { price: 500, name: 'Мушкет', type: 'range', color: 'brown' }
        }
      };

      // --- КОМПОНЕНТ: УПРАВЛЕНИЕ ИГРОЙ ---
      AFRAME.registerComponent('game-manager', {
        init: function () {
          this.moneyText = document.querySelector('#money-display');
          this.waveText = document.querySelector('#wave-display');
          this.shopPanel = document.querySelector('#shop-panel');
          this.zombieContainer = document.querySelector('#zombies');
          
          this.updateUI();
          this.startWave();
          
          // Слушаем событие убийства зомби
          this.el.addEventListener('zombie-killed', () => {
             // Логика окончания волны упрощена для примера
             if(document.querySelectorAll('.zombie').length <= 1) {
               this.nextWave();
             }
          });
        },
        
        updateUI: function() {
          this.moneyText.setAttribute('value', Money: ${gameState.money});
          this.waveText.setAttribute('value', Wave: ${gameState.wave});
        },

        toggleShop: function() {
          gameState.isShopOpen = !gameState.isShopOpen;
          this.shopPanel.setAttribute('visible', gameState.isShopOpen);
          // Перемещаем магазин перед лицом игрока
          if (gameState.isShopOpen) {
            const cam = document.querySelector('#camera');
            const pos = cam.getAttribute('position');
            const rot = cam.getAttribute('rotation');
            this.shopPanel.setAttribute('position', {x: pos.x, y: 1.5, z: pos.z - 1.5});
            this.shopPanel.setAttribute('rotation', {x: 0, y: rot.y, z: 0});
          }
        },

        buyWeapon: function(weaponKey) {
          const weapon = gameState.weapons[weaponKey];
          if (gameState.money >= weapon.price) {
            // Ищем свободный слот
            const emptySlotIndex = gameState.inventory.findIndex(item => item === null);
            if (emptySlotIndex !== -1) {
              gameState.money -= weapon.price;
              gameState.inventory[emptySlotIndex] = weaponKey;
              this.updateUI();
              this.spawnWeaponInBelt(emptySlotIndex, weaponKey);
              console.log("Куплено: " + weapon.name);
            } else {
              console.log("Нет места в инвентаре!");
            }
          }
        },

        spawnWeaponInBelt: function(index, weaponKey) {
          const slot = document.querySelector(#slot-${index});
          const color = gameState.weapons[weaponKey].color;
          // Визуализация оружия в слоте
          const weaponEntity = document.createElement('a-box');
          weaponEntity.setAttribute('scale', '0.05 0.05 0.2');
          weaponEntity.setAttribute('color', color);
          weaponEntity.setAttribute('class', 'clickable');
          // Добавляем логику взятия оружия (упрощено: просто помечаем активным)
          weaponEntity.addEventListener('click', () => {
            console.log("Взял оружие: " + weaponKey);

            document.querySelector('#right-hand-weapon').setAttribute('color', color);
            document.querySelector('#right-hand-weapon').setAttribute('visible', true);
            // Сохраняем тип текущего оружия в глобальный атрибут сцены для стрельбы
            document.querySelector('a-scene').setAttribute('current-weapon', weaponKey);

        startWave: function() {
          const count = gameState.wave * 2; // Зомби становится больше
          for(let i=0; i<count; i++) {
            this.spawnZombie();
          }
        },

        nextWave: function() {
          gameState.money += 100;
          gameState.wave += 1;
          this.updateUI();
          setTimeout(() => this.startWave(), 3000);
        },

        spawnZombie: function() {
          const z = document.createElement('a-box');
          z.setAttribute('class', 'zombie clickable');
          z.setAttribute('color', 'green');
          z.setAttribute('depth', 0.5); z.setAttribute('width', 0.5); z.setAttribute('height', 1.8);
          
          // Случайная позиция вокруг игрока
          const angle = Math.random() * Math.PI * 2;
          const radius = 5 + Math.random() * 5;
          const x = Math.cos(angle) * radius;
          const zPos = Math.sin(angle) * radius;
          
          z.setAttribute('position', ${x} 0 ${zPos});
          
          // Анимация движения к центру (0,0,0) - где стоит игрок
          z.setAttribute('animation', property: position; to: 0 0 0; dur: ${10000 - (gameState.wave * 500)}; easing: linear;);
          
          // Логика смерти
          z.addEventListener('click', () => {
             // Это сработает от "выстрела" (raycaster)
             this.killZombie(z);
          });

          // Простая коллизия для меча
          z.setAttribute('collision-listener', '');

          this.zombieContainer.appendChild(z);
        },

        killZombie: function(el) {
          if(el.parentNode) {
            el.parentNode.removeChild(el);
            this.el.emit('zombie-killed');
          }
        }
      });

      // --- КОМПОНЕНТ СТРЕЛЬБЫ/АТАКИ ---
      AFRAME.registerComponent('weapon-handler', {
        init: function() {
          this.el.addEventListener('triggerdown', this.attack.bind(this)); // Контроллер
          this.el.addEventListener('pinchstart', this.attack.bind(this)); // Руки
        },
        attack: function() {
          const scene = document.querySelector('a-scene');
          const weaponType = scene.getAttribute('current-weapon');
          
          if (!weaponType) return; // Нет оружия в руках

          const info = gameState.weapons[weaponType];

          if (info.type === 'range') {
            // Логика стрельбы (Raycaster обрабатывает click, но добавим звук/эффект)
            console.log("Пиу-пиу из " + info.name);
            // Создаем пулю (визуально)
            this.createBullet();
          } else {
            // Меч обрабатывается через физическую коллизию или дистанцию
            console.log("Взмах мечом!");
          }
        },
        createBullet: function() {
            // Упрощенная пуля
            const el = document.createElement('a-sphere');
            el.setAttribute('radius', 0.05);
            el.setAttribute('color', 'yellow');
            const pos = this.el.object3D.getWorldPosition(new THREE.Vector3());
            const rot = this.el.object3D.getWorldRotation(new THREE.Euler());
            el.setAttribute('position', pos);
            el.setAttribute('rotation', rot);
            document.querySelector('a-scene').appendChild(el);
            
            // Анимация полета вперед
             // Примечание: В реальной игре нужно считать вектор направления
            el.setAttribute('animation', 'property: position; to: 0 0 -10; dur: 500; easing: linear'); 
            setTimeout(() => el.remove(), 500);
        }
      });
    </script>
