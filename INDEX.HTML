<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hell Zoo VR - Escape Horror</title>
    <!-- A-Frame library for VR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff4444;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            z-index: 10;
        }
        .warning { color: yellow; font-weight: bold; }
        .danger { color: red; text-shadow: 0 0 10px red; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>АДСКИЙ ЗООПАРК</h1>
        <div id="status">Статус: Все клетки заперты</div>
        <div id="timer">До следующего кормления: <span id="time-left">05:00</span></div>
        <p>Нажимайте (триггер или клик) на кормушки, чтобы дать МЯСО.</p>
    </div>

    <a-scene fog="type: exponential; color: #1a0505; density: 0.15">
        <!-- Ресурсы и текстуры -->
        <a-assets>
            <img id="flesh-texture" src="https://i.imgur.com/rS2XgI1.jpg" crossorigin="anonymous">
            <img id="blood-floor" src="https://i.imgur.com/vH6vGxk.jpg" crossorigin="anonymous">
            <img id="metal-grate" src="https://i.imgur.com/wV2Q5Y8.jpg" crossorigin="anonymous">
        </a-assets>

        <!-- Окружение -->
        <a-sky color="#050000"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" src="#blood-floor" repeat="50 50"></a-plane>
        <a-light type="ambient" color="#331111"></a-light>
        <a-light type="point" position="0 5 0" intensity="0.5" color="#ff0000"></a-light>

        <!-- Камера и контроллеры -->
        <a-entity id="rig" position="0 0 15">
            <a-camera>
                <a-cursor color="#ff0000" fuse="false"></a-cursor>
            </a-camera>
            <a-entity laser-controls="hand: right"></a-entity>
            <a-entity laser-controls="hand: left"></a-entity>
        </a-entity>

        <!-- КЛЕТКА 1: Flesh -->
        <a-entity position="-10 0 -10" class="enclosure" data-monster="Flesh">
            <a-box position="0 2.5 0" width="6" height="5" depth="6" material="color: #222; opacity: 0.3; wireframe: true"></a-box>
            <!-- Прутья -->
            <a-cylinder position="-3 2.5 3" radius="0.1" height="5" color="#444"></a-cylinder>
            <a-cylinder position="3 2.5 3" radius="0.1" height="5" color="#444"></a-cylinder>
            <!-- Монстр Flesh -->
            <a-entity id="monster-flesh" position="0 0.5 0">
                <a-ellipsoid scale="1 0.7 1.5" color="#8b0000" material="roughness: 1">
                    <!-- Глаза -->
                    <a-sphere position="0.3 0.4 1.4" radius="0.1" color="white"></a-sphere>
                    <a-sphere position="-0.3 0.4 1.4" radius="0.1" color="white"></a-sphere>
                    <a-sphere position="0 0.7 1.2" radius="0.1" color="white"></a-sphere>
                </a-ellipsoid>
                <a-cylinder position="0.5 -0.3 0.8" radius="0.15" height="1" color="#5a0000"></a-cylinder>
                <a-cylinder position="-0.5 -0.3 0.8" radius="0.15" height="1" color="#5a0000"></a-cylinder>
                <a-cylinder position="0.5 -0.3 -0.8" radius="0.15" height="1" color="#5a0000"></a-cylinder>
                <a-cylinder position="-0.5 -0.3 -0.8" radius="0.15" height="1" color="#5a0000"></a-cylinder>
            </a-entity>
            <a-box class="feeder" position="0 0.5 3.2" width="1" height="0.5" depth="0.5" color="#ff4444" 
                   onclick="feedMonster('Flesh')"></a-box>
        </a-entity>

        <!-- КЛЕТКА 2: Mu-Trap -->
        <a-entity position="0 0 -10" class="enclosure" data-monster="MuTrap">
            <a-box position="0 2.5 0" width="6" height="5" depth="6" material="color: #222; opacity: 0.3; wireframe: true"></a-box>
            <a-entity id="monster-mutrap" position="0 0 0">
                <!-- Тело человека в костюме коровы -->
                <a-box position="0 1.5 0" width="0.8" height="1.8" depth="0.5" color="white" 
                       material="src: url(https://upload.wikimedia.org/wikipedia/commons/d/d4/Cow_pattern_02.svg); repeat: 2 2"></a-box>
                <!-- Ободранное лицо -->
                <a-sphere position="0 2.6 0" radius="0.35" color="#cc0000">
                    <a-plane position="0 0 0.31" width="0.4" height="0.4" color="#550000" material="opacity: 0.9"></a-plane>
                </a-sphere>
            </a-entity>
            <a-box class="feeder" position="0 0.5 3.2" width="1" height="0.5" depth="0.5" color="#ff4444" 
                   onclick="feedMonster('MuTrap')"></a-box>
        </a-entity>

        <!-- КЛЕТКА 3: Blob -->
        <a-entity position="10 0 -10" class="enclosure" data-monster="Blob">
            <a-box position="0 2.5 0" width="6" height="5" depth="6" material="color: #222; opacity: 0.3; wireframe: true"></a-box>
            <a-entity id="monster-blob" position="0 0.3 0">
                <a-sphere scale="1.5 0.8 1.5" color="yellow" material="roughness: 0.1">
                    <a-box position="0 -0.2 1.4" width="1.2" height="0.4" depth="0.2" color="black">
                        <!-- Зубы -->
                        <a-cone position="-0.4 0.1 0.1" radius-bottom="0.05" height="0.15" color="white"></a-cone>
                        <a-cone position="0 0.1 0.1" radius-bottom="0.05" height="0.15" color="white"></a-cone>
                        <a-cone position="0.4 0.1 0.1" radius-bottom="0.05" height="0.15" color="white"></a-cone>
                    </a-box>
                </a-sphere>
                <!-- Глаза улитки -->
                <a-cylinder position="0.5 0.8 0.5" radius="0.05" height="1" color="yellow">
                    <a-sphere position="0 0.5 0" radius="0.15" color="white"><a-sphere radius="0.05" color="black" position="0 0 0.13"></a-sphere></a-sphere>
                </a-cylinder>
                <a-cylinder position="-0.5 0.8 0.5" radius="0.05" height="1" color="yellow">
                    <a-sphere position="0 0.5 0" radius="0.15" color="white"><a-sphere radius="0.05" color="black" position="0 0 0.13"></a-sphere></a-sphere>
                </a-cylinder>
            </a-entity>
            <a-box class="feeder" position="0 0.5 3.2" width="1" height="0.5" depth="0.5" color="#ff4444" 
                   onclick="feedMonster('Blob')"></a-box>
        </a-entity>

        <!-- КЛЕТКА 4: Giant White (Behemoth) -->
        <a-entity position="-15 0 0" class="enclosure" data-monster="Giant">
            <a-box position="0 6 0" width="15" height="12" depth="15" material="color: #222; opacity: 0.3; wireframe: true"></a-box>
            <a-entity id="monster-giant" position="0 2.5 0" scale="6 6 6">
                <a-ellipsoid scale="1 0.7 1.5" color="#ffffff">
                    <!-- 11 глаз разбросаны -->
                    <a-sphere position="0.2 0.5 1.4" radius="0.05" color="red"></a-sphere>
                    <a-sphere position="-0.2 0.5 1.4" radius="0.05" color="red"></a-sphere>
                    <a-sphere position="0 0.7 1.2" radius="0.05" color="red"></a-sphere>
                    <a-sphere position="0.4 0.3 1.3" radius="0.05" color="red"></a-sphere>
                    <a-sphere position="-0.4 0.3 1.3" radius="0.05" color="red"></a-sphere>
                </a-ellipsoid>
                <!-- Огромные зубы -->
                <a-cone position="0 -0.5 1.5" rotation="180 0 0" radius-bottom="0.2" height="0.5" color="white"></a-cone>
            </a-entity>
            <a-box class="feeder" position="0 0.5 7.7" width="2" height="1" depth="1" color="#ff4444" 
                   onclick="feedMonster('Giant')"></a-box>
        </a-entity>

        <!-- КЛЕТКА 5: Mimic Wood -->
        <a-entity position="15 0 0" class="enclosure" data-monster="Mimic">
            <a-box position="0 2.5 0" width="6" height="5" depth="6" material="color: #222; opacity: 0.3; wireframe: true"></a-box>
            <a-box id="monster-mimic" position="0 2 0" width="0.5" height="4" depth="0.1" color="#8b4513" 
                   animation__shake="property: rotation; to: 0 5 0; dur: 100; dir: alternate; loop: true; startEvents: mouseenter">
                <!-- Щупальца (скрыты до активации) -->
                <a-entity id="mimic-tentacles" visible="false">
                    <a-cylinder position="0 0 0" rotation="90 0 0" radius="0.05" height="4" color="black"></a-cylinder>
                    <a-cylinder position="0 1 0" rotation="45 90 0" radius="0.05" height="4" color="black"></a-cylinder>
                </a-entity>
            </a-box>
            <a-box class="feeder" position="0 0.5 3.2" width="1" height="0.5" depth="0.5" color="#ff4444" 
                   onclick="feedMonster('Mimic')"></a-box>
        </a-entity>

        <!-- КЛЕТКА 6: Mega Shark (Aquarium) -->
        <a-entity position="-10 0 10" class="enclosure" data-monster="Shark">
            <a-box position="0 3 0" width="8" height="6" depth="8" material="color: #0044ff; opacity: 0.2; transparent: true"></a-box>
            <a-entity id="monster-shark" position="0 3 0">
                <a-cone rotation="90 0 0" radius-bottom="1" height="4" color="#333">
                    <!-- 21 глаз -->
                    <a-sphere position="0.8 1.5 0" radius="0.1" color="yellow"></a-sphere>
                    <a-sphere position="-0.8 1.5 0" radius="0.1" color="yellow"></a-sphere>
                </a-cone>
                <!-- 5 щупалец -->
                <a-entity position="0 0 -2">
                    <a-cylinder rotation="0 0 45" radius="0.1" height="3" color="#222" position="1 0 0"></a-cylinder>
                    <a-cylinder rotation="0 0 -45" radius="0.1" height="3" color="#222" position="-1 0 0"></a-cylinder>
                </a-entity>
                <!-- Шипы на хвосте -->
                <a-cone position="0 0 -2.5" radius-bottom="0.05" height="0.5" color="white" rotation="-90 0 0"></a-cone>
            </a-entity>
            <a-box class="feeder" position="0 0.5 4.2" width="1" height="0.5" depth="0.5" color="#ff4444" 
                   onclick="feedMonster('Shark')"></a-box>
        </a-entity>

        <!-- КЛЕТКА 7: Mouth Squid (Aquarium Small) -->
        <a-entity position="0 0 10" class="enclosure" data-monster="Squid">
            <a-box position="0 2 0" width="4" height="4" depth="4" material="color: #0044ff; opacity: 0.2; transparent: true"></a-box>
            <a-entity id="monster-squid" position="0 1.5 0" scale="0.5 0.5 0.5">
                <a-sphere radius="1" color="#4b0082">
                    <!-- Рот вместо глаз -->
                    <a-box position="0 0 0.9" width="0.8" height="0.5" depth="0.2" color="red"></a-box>
                </a-sphere>
                <!-- 37 мелких щупалец -->
                <a-entity id="squid-tentacles"></a-entity>
            </a-entity>
            <a-box class="feeder" position="0 0.5 2.2" width="1" height="0.5" depth="0.5" color="#ff4444" 
                   onclick="feedMonster('Squid')"></a-box>
        </a-entity>

        <!-- КЛЕТКА 8: Blood Zigzag -->
        <a-entity position="10 0 10" class="enclosure" data-monster="Blood">
            <a-box position="0 2.5 0" width="6" height="5" depth="6" material="color: #222; opacity: 0.3; wireframe: true"></a-box>
            <a-entity id="monster-blood" position="0 0 0">
                <a-sphere position="0 2 0" radius="0.5" color="#ff0000">
                    <a-sphere position="0.2 0.1 0.4" radius="0.1" color="white"></a-sphere>
                    <a-sphere position="-0.2 0.1 0.4" radius="0.1" color="white"></a-sphere>
                    <!-- Рот как у человека -->
                    <a-plane position="0 -0.2 0.51" width="0.4" height="0.1" color="pink"></a-plane>
                </a-sphere>
                <!-- Зигзагообразные ноги -->
                <a-entity position="0 1 0">
                    <a-cylinder position="0.3 -0.5 0" rotation="0 0 20" radius="0.05" height="1" color="#800000"></a-cylinder>
                    <a-cylinder position="0.5 -1.3 0" rotation="0 0 -40" radius="0.05" height="1" color="#800000"></a-cylinder>
                </a-entity>
            </a-entity>
            <a-box class="feeder" position="0 0.5 3.2" width="1" height="0.5" depth="0.5" color="#ff4444" 
                   onclick="feedMonster('Blood')"></a-box>
        </a-entity>

    </a-scene>

    <script>
        // Инициализация игры
        const MONSTERS = ['Flesh', 'MuTrap', 'Blob', 'Giant', 'Mimic', 'Shark', 'Squid', 'Blood'];
        let hungerTimer = 300; // 5 минут в секундах
        let gameActive = true;

        // Генерация 37 щупалец для кальмара
        const squidContainer = document.querySelector('#squid-tentacles');
        for (let i = 0; i < 37; i++) {
            const t = document.createElement('a-cylinder');
            const angle = (i / 37) * Math.PI * 2;
            const x = Math.cos(angle) * 0.8;
            const z = Math.sin(angle) * 0.8;
            t.setAttribute('position', `${x} -1 ${z}`);
            t.setAttribute('radius', '0.02');
            t.setAttribute('height', '1.5');
            t.setAttribute('color', '#4b0082');
            t.setAttribute('rotation', `${Math.random()*20} 0 ${Math.random()*20}`);
            squidContainer.appendChild(t);
        }

        // Функция кормления
        window.feedMonster = function(name) {
            if (!gameActive) return;
            console.log("Кормление монстра: " + name);
            hungerTimer = 300; // Сброс общего таймера зоопарка
            document.getElementById('status').innerText = `Статус: ${name} наелся.`;
            document.getElementById('status').className = '';
            
            // Визуальный эффект кормления
            const flash = document.createElement('a-light');
            flash.setAttribute('type', 'point');
            flash.setAttribute('color', 'green');
            flash.setAttribute('intensity', '2');
            flash.setAttribute('position', '0 2 15');
            document.querySelector('a-scene').appendChild(flash);
            setTimeout(() => flash.remove(), 500);
        };

        // Логика побега
        function monsterEscape() {
            gameActive = false;
            document.getElementById('status').innerText = "КАТАСТРОФА: МОНСТРЫ СБЕЖАЛИ!";
            document.getElementById('status').className = 'danger';
            
            // Анимация нападения (двигаем монстров к игроку)
            MONSTERS.forEach(id => {
                const entity = document.querySelector(`#monster-${id.toLowerCase()}`);
                if (entity) {
                    entity.setAttribute('animation', {
                        property: 'position',
                        to: '0 0 15',
                        dur: 3000,
                        easing: 'linear'
                    });
                }
            });

            // Красный свет тревоги
            const alarm = document.createElement('a-light');
            alarm.setAttribute('type', 'ambient');
            alarm.setAttribute('color', 'red');
            alarm.setAttribute('intensity', '2');
            document.querySelector('a-scene').appendChild(alarm);
        }

        // Таймер обратного отсчета
        setInterval(() => {
            if (!gameActive) return;
            
            hungerTimer--;
            
            const mins = Math.floor(hungerTimer / 60);
            const secs = hungerTimer % 60;
            document.getElementById('time-left').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            if (hungerTimer <= 60) {
                document.getElementById('status').innerText = "ВНИМАНИЕ: МОНСТРЫ ГОЛОДНЫ!";
                document.getElementById('status').className = 'warning';
            }

            if (hungerTimer <= 0) {
                monsterEscape();
            }
        }, 1000);

        // Специфическое поведение для Мимика (Клетка 5)
        document.querySelector('#monster-mimic').addEventListener('mouseenter', () => {
            document.querySelector('#mimic-tentacles').setAttribute('visible', 'true');
        });
        document.querySelector('#monster-mimic').addEventListener('mouseleave', () => {
            document.querySelector('#mimic-tentacles').setAttribute('visible', 'false');
        });

    </script>
</body>
</html>
